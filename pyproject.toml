[build-system]
requires = ["setuptools", "py2app"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "time-recorder"
dynamic = ["version"]
description = "⏰ 干啥来着 — macOS 菜单栏活动记录器"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "newjokker"},
]
keywords = ["time", "tracker", "macos", "menubar", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
urls = {Homepage = "https://github.com/newjokker/WhatAmIDoing", Source = "https://github.com/newjokker/WhatAmIDoing", Releases = "https://github.com/newjokker/WhatAmIDoing/releases"}
